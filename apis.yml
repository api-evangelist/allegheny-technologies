description: >-
  Allegheny Technologies Incorporated, which trades and brands itself as ATI Inc., is an American
  producer of specialty materials and components headquartered in Dallas, Texas and listed on the
  NYSE under the ticker ATI. ATI melts, forges, rolls, machines and additively manufactures
  titanium and titanium alloys, nickel-based alloys and superalloys, stainless and specialty
  steels, zirconium, hafnium, niobium and tungsten materials, plus forgings and castings. It
  serves aerospace and defense — over half of sales — along with oil and gas, chemical and
  hydrocarbon processing, power generation, medical and electronics markets, on roughly $4.6
  billion in annual revenue. ATI is a materials manufacturer rather than a software company and
  publishes no public API: as of 2026-09-01 probing found no developer portal, no API reference,
  no OpenAPI, AsyncAPI, GraphQL or WSDL contract, no SDK on any public package registry and no
  GitHub organization. The only credentialed digital surfaces are My ATI, a customer and supplier
  extranet behind a logon form, and a third-party sourcing platform linked from the supplier
  self-service page; customer onboarding itself is documented as PDF forms emailed to a sales
  contact.
