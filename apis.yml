description: >-
  Allegheny Technologies Incorporated (ATI) is an American producer of
  specialty materials headquartered in Dallas, Texas. ATI produces metals
  including titanium and titanium alloys, nickel-based alloys and superalloys,
  stainless and specialty steels, zirconium, hafnium, niobium, tungsten
  materials, forgings, and castings. The company serves aerospace and defense
  (over 50% of sales), oil and gas, chemical process industry, electrical
  energy, and medical markets. ATI generates approximately $4.6 billion in
  annual revenue and is listed on the NYSE (ticker: ATI). As a specialty
  materials manufacturer focused on advanced metals production, ATI does not
  maintain a public developer API program, but engages in EDI-based supply
  chain integrations with aerospace OEM customers including Boeing and Airbus.
